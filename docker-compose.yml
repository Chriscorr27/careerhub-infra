version: '4'

services:
  mongodb:
    image: mongo:6.0
    container_name: mongodb
    restart: always
    networks:
      - backend
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: Chris
      MONGO_INITDB_DATABASE: career_hub
    volumes:
      - mongo_data:/data/db
  mysqldb:
      image: mysql:8.0
      container_name: mysqldb
      restart: always
      networks:
        - backend
      environment:
        MYSQL_ROOT_PASSWORD: Chris
      volumes:
        - mysql_data:/var/lib/mysql
        - ./docker/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql
      ports:
        - "3316:3306"
  redis:
    image: redis:alpine
    container_name: redis
    ports:
      - "6379:6379"
    networks:
      - backend
    volumes:
      - redis_data:/data
    restart: always
  kafka:
    image: apache/kafka:4.2.1
    container_name: kafka
    networks:
      - backend
    ports:
      - "9092:9092"
      - "29092:29092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_DELETE_TOPIC_ENABLE: "true"
  kafka-ui:
    container_name: kafka-ui
    image: provectuslabs/kafka-ui:latest
    networks:
      - backend
    ports:
      - "8086:8080"
    depends_on:
      - kafka
    environment:
      KAFKA_CLUSTERS_NAME: local
      KAFKA_CLUSTERS_BOOTSTRAPSERVERS: kafka:29092
      DYNAMIC_CONFIG_ENABLED: 'true'
  careerhub-backend:
    container_name: careerhub-backend
    image: chris2708/careerhub-backend:latest
    networks:
      - backend
    ports:
      - "8000:8000"
    depends_on:
      - kafka
      - mysqldb
      - mongodb
      - redis
    env_file:
      - docker-compose.env.secret
    environment:
      MYSQL_URL: jdbc:mysql://mysqldb:3306/career_hub
      MYSQL_USERNAME: root
      MYSQL_PASSWORD: Chris
      MONGODB_URI: mongodb://root:Chris@mongodb:27017/career_hub?authSource=admin&uuidRepresentation=STANDARD
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_TIMEOUT: 2s
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      KAFKA_CONSUMER_GROUP: careerhub
    volumes:
      - ~/.aws:/root/.aws:ro
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    networks:
      - backend
    ports:
      - "9090:9090"
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    depends_on:
      - careerhub-backend
  grafana:
    image: grafana/grafana:latest
    container_name: careerhub-grafana
    networks:
      - backend
    ports:
      - "3000:3000"
    links:
      - prometheus:prometheus
    environment:
      - GF_SECURITY_ADMIN_USER=root
      - GF_SECURITY_ADMIN_PASSWORD=Chris
    volumes:
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus

volumes:
  mongo_data:
  mysql_data:
  redis_data:
  grafana-data:

networks:
  backend:
    driver: bridge
